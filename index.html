<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1B6B4A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ManuTech" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <title>ManuTech – Gestione Manutenzione</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Splash statico pre-JS: visibile all'avvio (PWA cold start) finché
         React non monta e sostituisce il contenuto di #root. -->
    <div id="root">
      <style>
        /* Ingresso: parte DA FERMO (scala 1, centro schermo) come lo splash
           di sistema, poi un colpo d'ingranaggio avanti-indietro. Niente
           salto di posizione o scala rispetto all'icona statica del SO. */
        @keyframes bootIn { 0% { transform: rotate(0deg) scale(1); } 30% { transform: rotate(-16deg) scale(0.97); } 68% { transform: rotate(9deg) scale(1.04); } 100% { transform: rotate(0deg) scale(1); } }
        /* Loop: fluttuazione leggera */
        @keyframes bootFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
        /* Loop: respiro del glow blu */
        @keyframes bootGlow { 0%, 100% { box-shadow: 0 0 22px rgba(74, 138, 220, 0.35); } 50% { box-shadow: 0 0 54px rgba(74, 138, 220, 0.65); } }
        /* Loop: anello radar che si espande e svanisce */
        @keyframes bootRing { 0% { transform: scale(0.75); opacity: 0.55; } 100% { transform: scale(1.9); opacity: 0; } }
        @keyframes bootFadeUp { 0% { transform: translateY(12px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
      </style>
      <div style="position: fixed; inset: 0; background: #0d1e38; overflow: hidden;">
        <!-- Logo ancorato al centro esatto dello schermo, come lo splash del SO -->
        <div style="position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px; animation: bootIn 0.85s ease-in-out 0.15s both;">
          <span aria-hidden="true" style="position: absolute; inset: -8px; border: 2px solid rgba(96, 156, 232, 0.55); border-radius: 30px; animation: bootRing 1.9s ease-out 1s infinite;"></span>
          <img src="/logo.png" alt="ManuTech" style="width: 96px; height: 96px; border-radius: 24px; display: block; animation: bootFloat 2.8s ease-in-out 1s infinite, bootGlow 2.8s ease-in-out 1s infinite;" />
        </div>
        <!-- Titolo sotto al logo, senza influenzarne il centraggio -->
        <div style="position: absolute; left: 0; right: 0; top: calc(50% + 66px); text-align: center; font-family: 'Outfit', system-ui, sans-serif; font-size: 20px; font-weight: 700; color: #f2f2f8; letter-spacing: -0.01em; animation: bootFadeUp 0.55s ease-out 0.5s both;">ManuTech</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
